name: Nightly Test Coverage

on:
  workflow_dispatch:
  schedule:
    - cron: "0 19 * * *"
  pull_request:
    types: [labeled, synchronize, reopened]

env:
  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
  E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
  E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
  E2E_BUYER_EMAIL: ${{ secrets.E2E_BUYER_EMAIL }}
  E2E_BUYER_PASSWORD: ${{ secrets.E2E_BUYER_PASSWORD }}
  E2E_SELLER_EMAIL: ${{ secrets.E2E_SELLER_EMAIL }}
  E2E_SELLER_PASSWORD: ${{ secrets.E2E_SELLER_PASSWORD }}
  E2E_LISTING_ID: ${{ secrets.E2E_LISTING_ID }}
  E2E_SELLER_ID: ${{ secrets.E2E_SELLER_ID }}
  E2E_LISTING_PRODUCT_ID: ${{ secrets.E2E_LISTING_PRODUCT_ID }}
  E2E_CHECKOUT_ORDER_ID: ${{ secrets.E2E_CHECKOUT_ORDER_ID }}

jobs:
  nightly-coverage:
    name: Nightly L2 + L1 + L3 (serial)
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Clone repository
        uses: actions/checkout@v7.0.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: package.json
          cache: true

      - name: Install dependencies
        run: bun ci

      - name: Install Playwright browsers
        run: bunx playwright install chromium --with-deps

      - name: Run nightly test coverage (L2 → L1 → L3)
        run: bun run test:nightly:coverage
        env:
          CI: true

  platform-integration:
    name: Platform integration (PR optional L2)
    if: |
      github.event_name == 'pull_request' &&
      contains(github.event.pull_request.labels.*.name, 'platform')
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v7.0.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: package.json
          cache: true

      - name: Install dependencies
        run: bun ci

      - name: Run platform integration tests
        run: bun run test:integration:platform

  p2-e2e:
    name: P2 E2E (PR optional L1)
    if: |
      github.event_name == 'pull_request' &&
      contains(github.event.pull_request.labels.*.name, 'nightly-e2e')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Clone repository
        uses: actions/checkout@v7.0.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: package.json
          cache: true

      - name: Install dependencies
        run: bun ci

      - name: Install Playwright browsers
        run: bunx playwright install chromium --with-deps

      - name: Build production bundle
        run: bun run build
        env:
          CI: true
          PRODUCTION_GATE: "1"

      - name: Start production server
        run: |
          bun run start &
          for i in $(seq 1 90); do
            if curl -m 3 -s -o /dev/null -w "%{http_code}" http://localhost:3000/ | grep -qE '^[23]'; then
              echo "Server ready"
              exit 0
            fi
            sleep 2
          done
          echo "Server did not become ready" >&2
          exit 1

      - name: Run P2 nightly E2E
        run: bun run test:e2e:nightly:p2
        env:
          CI: true
          PRODUCTION_GATE: "1"
          PLAYWRIGHT_SKIP_WEBSERVER: "1"
          PLAYWRIGHT_BASE_URL: http://localhost:3000
