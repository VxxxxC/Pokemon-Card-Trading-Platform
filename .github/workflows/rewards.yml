name: Rewards QA Gate

on:
  workflow_dispatch:
  schedule:
    - cron: "0 21 * * *"
  pull_request:
    types: [labeled, synchronize, reopened]

jobs:
  rewards-integration:
    name: Rewards Vitest Integration
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'rewards'))
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v7.0.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: package.json
          cache: true

      - name: Install dependencies
        run: bun ci

      - name: Run rewards integration tests
        run: bun run test:integration:rewards
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          E2E_BUYER_EMAIL: ${{ secrets.E2E_BUYER_EMAIL }}
          E2E_BUYER_PASSWORD: ${{ secrets.E2E_BUYER_PASSWORD }}
          E2E_SELLER_EMAIL: ${{ secrets.E2E_SELLER_EMAIL }}
          E2E_SELLER_PASSWORD: ${{ secrets.E2E_SELLER_PASSWORD }}
          E2E_LISTING_ID: ${{ secrets.E2E_LISTING_ID }}
          E2E_SELLER_ID: ${{ secrets.E2E_SELLER_ID }}

  rewards-e2e:
    name: Rewards Playwright E2E
    needs: rewards-integration
    if: |
      always() &&
      needs.rewards-integration.result == 'success' &&
      (
        github.event_name == 'workflow_dispatch' ||
        github.event_name == 'schedule' ||
        (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'rewards'))
      )
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v7.0.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: package.json
          cache: true

      - name: Install dependencies
        run: bun ci

      - name: Install Playwright browsers
        run: bunx playwright install chromium --with-deps

      - name: Run rewards release gate E2E
        run: |
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            echo ">>> Scheduled run: production subset (excludes platform-rewards-matrix)"
            bun run test:e2e:rewards-gate:production
          else
            echo ">>> Manual/PR run: full gate (includes platform-rewards-matrix)"
            bun run test:e2e:rewards-gate
          fi
        env:
          CI: true
          REWARDS_GATE: "1"
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          E2E_BUYER_EMAIL: ${{ secrets.E2E_BUYER_EMAIL }}
          E2E_BUYER_PASSWORD: ${{ secrets.E2E_BUYER_PASSWORD }}
          E2E_SELLER_EMAIL: ${{ secrets.E2E_SELLER_EMAIL }}
          E2E_SELLER_PASSWORD: ${{ secrets.E2E_SELLER_PASSWORD }}
          E2E_LISTING_ID: ${{ secrets.E2E_LISTING_ID }}
          E2E_SELLER_ID: ${{ secrets.E2E_SELLER_ID }}

  rewards-mutation:
    name: Rewards Mutation (weekly)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v7.0.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: package.json
          cache: true

      - name: Install dependencies
        run: bun ci

      - name: Run mutation tests
        run: bun run test:rewards:mutation
