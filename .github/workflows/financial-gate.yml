name: Financial Gate (Partial)

on:
  workflow_dispatch:
  pull_request:
    types: [labeled, synchronize, reopened]

jobs:
  gate-partial:
    name: Gate 3 Partial (webhook / coupon / connect / moderation)
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'financial'))
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v7.0.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: package.json
          cache: true

      - name: Install dependencies
        run: bun ci

      - name: Require integration env (no false-green skips)
        run: CI_INTEGRATION_REQUIRED=1 bun run test:ci:require-integration-env
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          E2E_BUYER_EMAIL: ${{ secrets.E2E_BUYER_EMAIL }}
          E2E_BUYER_PASSWORD: ${{ secrets.E2E_BUYER_PASSWORD }}
          E2E_SELLER_EMAIL: ${{ secrets.E2E_SELLER_EMAIL }}
          E2E_SELLER_PASSWORD: ${{ secrets.E2E_SELLER_PASSWORD }}
          E2E_SELLER_ID: ${{ secrets.E2E_SELLER_ID }}
          E2E_LISTING_ID: ${{ secrets.E2E_LISTING_ID }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}

      - name: Run partial financial gate
        run: bun run test:gate:partial
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          E2E_BUYER_EMAIL: ${{ secrets.E2E_BUYER_EMAIL }}
          E2E_BUYER_PASSWORD: ${{ secrets.E2E_BUYER_PASSWORD }}
          E2E_SELLER_EMAIL: ${{ secrets.E2E_SELLER_EMAIL }}
          E2E_SELLER_PASSWORD: ${{ secrets.E2E_SELLER_PASSWORD }}
          E2E_SELLER_ID: ${{ secrets.E2E_SELLER_ID }}
          E2E_LISTING_ID: ${{ secrets.E2E_LISTING_ID }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
